version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coursebrain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coursebrain
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
      TRIBE_CACHE_FOLDER: /app/cache
      ENABLE_TRIBE: "false"
      ENABLE_LLM: "false"
      ENABLE_OCR: "false"
      MOCK_ANALYSIS: "true"
      TASK_TIME_LIMIT_SECONDS: "3600"
      MAX_VIDEO_DURATION_SECONDS: "1800"
      VIDEO_SAMPLE_INTERVAL: "5.0"
      TRANSCRIPT_WINDOW_SIZE: "30"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/app
      - storage_data:/app/storage
      - cache_data:/app/cache
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coursebrain
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
      TRIBE_CACHE_FOLDER: /app/cache
      ENABLE_TRIBE: "false"
      ENABLE_LLM: "false"
      ENABLE_OCR: "false"
      MOCK_ANALYSIS: "true"
      TASK_TIME_LIMIT_SECONDS: "3600"
      MAX_VIDEO_DURATION_SECONDS: "1800"
      VIDEO_SAMPLE_INTERVAL: "5.0"
      TRANSCRIPT_WINDOW_SIZE: "30"
    volumes:
      - ../services/api:/app
      - storage_data:/app/storage
      - cache_data:/app/cache
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  storage_data:
  cache_data:
